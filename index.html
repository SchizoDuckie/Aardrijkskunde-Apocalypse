<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aardrijkskunde Apocalyps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="flash-overlay"></div>

<!-- ===== MENU ===== -->
<div id="menu" class="screen active">
<div class="scanline"></div>
<div class="inner">
  <div class="subtitle" id="menu-subtitle">⚠ GEHEIM WAPEN ⚠</div>
  <h1 class="title"><span class="word1" id="menu-title1">AARDRIJKSKUNDE</span><br><span class="word2" id="menu-title2">APOCALYPS</span></h1>
  <div class="desc" id="menu-desc">Kies een set en blaas de juiste plekken op!</div>
  <div class="toolbar">
    <button class="toolbar-btn" id="btn-sound" onclick="onToggleSound()">🔊 GELUID AAN</button>
    <button class="toolbar-btn" id="btn-lang" onclick="onToggleLang()">🇬🇧 English</button>
  </div>
  <div class="section-label" id="label-hw">HUISWERK SETS</div><div id="hw-sets"></div>
  <div class="section-label" id="label-extra">EXTRA SETS</div><div id="extra-sets"></div>
  <div class="section-label" id="label-custom">EIGEN SETS</div><div id="custom-sets"></div>
  <div style="margin-top:14px"><button class="btn sm" id="btn-new-set" onclick="showEditor()">+ NIEUWE SET</button></div>
</div>
</div>

<!-- ===== GAME ===== -->
<div id="game" class="screen">
<div id="game-hud">
  <div class="hud-top">
    <button class="hud-stop" onclick="exitGame()">✕</button>
    <span class="hud-round" id="hud-round">☢ 1/10</span>
    <span class="hud-qd" id="hud-qd"></span>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="hud-streak" id="hud-streak"></span>
      <span class="hud-score" id="hud-score">0</span>
    </div>
  </div>
  <div class="hud-question" id="hud-qm"></div>
</div>
<div id="map-wrap">
  <div id="map"></div>
  <canvas id="boom-canvas"></canvas>
  <div id="missile-layer"></div>
</div>
<div id="toast"></div>
</div>

<!-- ===== RESULTS ===== -->
<div id="results" class="screen">
<div class="scanline"></div>
<div class="inner">
  <div id="res-mission" style="font-size:12px;letter-spacing:4px;color:var(--accent1)">MISSIE VOLTOOID</div>
  <h1 class="title" style="font-size:clamp(22px,5vw,34px);margin-top:10px"><span class="word2" id="res-title">DEBRIEFING</span></h1>
  <div class="stat-row">
    <div class="stat-box"><div class="stat-label" id="res-score-label">SCORE</div><div class="stat-value" id="res-score" style="font-size:30px;color:var(--accent2)"></div></div>
    <div class="stat-box"><div class="stat-label" id="res-streak-label">BESTE REEKS</div><div class="stat-value" id="res-streak" style="font-size:30px;color:var(--accent3)"></div></div>
  </div>
  <div class="rank-box" id="res-rank-box"><div class="stat-label" id="res-rank-label">RANG</div><div class="stat-value" id="res-rank" style="font-size:24px"></div></div>
  <div id="hs-area"></div>
  <div class="btn-row" style="margin-top:16px">
    <button class="btn" id="btn-restart" onclick="restartGame()">🔄 OPNIEUW</button>
    <button class="btn sec" id="btn-menu" onclick="showScreen('menu')">⬅ MENU</button>
  </div>
</div>
</div>

<!-- ===== EDITOR ===== -->
<div id="editor" class="screen">
<div class="inner">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2 style="font-family:var(--d);color:var(--accent2);font-size:18px;letter-spacing:2px">SET BEWERKEN</h2>
    <button class="hud-stop" onclick="showScreen('menu')" style="min-height:44px">✕</button>
  </div>
  <label class="ed-label">SET NAAM</label>
  <input id="ed-name" class="ed-input" value="Mijn Set" style="margin-bottom:12px">
  <div class="ed-section">
    <div style="color:#ffffff66;font-size:10px;margin-bottom:8px">LOCATIE TOEVOEGEN</div>
    <div style="margin-bottom:8px"><label class="ed-label">Naam</label><input id="ed-loc-name" class="ed-input" placeholder="b.v. Parijs"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <div><label class="ed-label">Lat</label><input id="ed-loc-lat" class="ed-input" placeholder="48.86" inputmode="decimal"></div>
      <div><label class="ed-label">Lng</label><input id="ed-loc-lng" class="ed-input" placeholder="2.35" inputmode="decimal"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <div><label class="ed-label">Type</label>
        <select id="ed-loc-type" class="ed-input" style="height:44px">
          <option value="capital">hoofdstad</option><option value="city">stad</option>
          <option value="land">land</option><option value="water">water</option><option value="gebied">gebied</option>
        </select>
      </div>
      <div><label class="ed-label">Hoofdstad van</label><input id="ed-loc-of" class="ed-input" placeholder="Frankrijk"></div>
    </div>
    <div style="margin-bottom:8px"><label class="ed-label">Leuk feitje (optioneel)</label><input id="ed-loc-fact" class="ed-input" placeholder="Hier staat het oudste..."></div>
    <button class="btn sm" onclick="editorAddLoc()">+ TOEVOEGEN</button>
  </div>
  <div style="margin-bottom:12px">
    <button class="btn sm sec" onclick="toggleJsonImport()">▼ IMPORTEER JSON</button>
    <div id="json-import" style="display:none;margin-top:8px">
      <textarea id="ed-json" class="ed-input" rows="4" style="resize:vertical"></textarea>
      <div id="json-err" style="color:var(--r);font-size:11px;margin-top:4px;display:none"></div>
      <div style="margin-top:6px"><button class="btn sm" onclick="editorImportJson()">IMPORTEER</button></div>
    </div>
  </div>
  <div style="color:#ffffff66;font-size:10px;margin-bottom:6px">LOCATIES (<span id="ed-count">0</span>)</div>
  <div id="ed-list" style="max-height:200px;overflow-y:auto;margin-bottom:12px"></div>
  <button class="btn" id="ed-save" onclick="editorSave()" disabled>💾 OPSLAAN</button>
  <div id="ed-warn" style="color:#ff440088;font-size:10px;margin-top:6px;display:none">Min. 3 locaties nodig</div>
</div>
</div>

<script src="js/i18n.js"></script>
<script src="js/sound.js"></script>
<script src="js/data.js"></script>
<script src="js/questions.js"></script>
<script src="js/particles.js"></script>
<script src="js/highscores.js"></script>
<script src="js/game.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
